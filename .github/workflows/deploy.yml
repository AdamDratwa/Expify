name: Build and deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: src/Expify.Web/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/Expify.Web
        run: npm ci

      - name: Test frontend
        working-directory: src/Expify.Web
        run: npx ng test --watch=false

      - name: Build frontend
        working-directory: src/Expify.Web
        run: npm run build

      - name: Copy SPA into API wwwroot
        run: |
          mkdir -p src/Expify.Api/wwwroot
          cp -r src/Expify.Web/dist/expify-web/browser/. src/Expify.Api/wwwroot/

      - name: Publish API
        run: dotnet publish src/Expify.Api -c Release -o publish

      - name: Check SPA is in the publish output
        run: test -f publish/wwwroot/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.sha }}
          path: publish
          retention-days: 90

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # No `environment:` key on purpose: it would change the OIDC subject and break
    # the federated credential bound to repo:AdamDratwa/Expify:ref:refs/heads/master.
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-${{ github.sha }}
          path: publish

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish

      - name: Smoke test
        run: curl --fail --silent --show-error --retry 10 --retry-delay 10 --retry-all-errors https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health
